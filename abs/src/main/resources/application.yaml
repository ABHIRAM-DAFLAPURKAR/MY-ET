# Docker-optimized config with Redis caching (300s TTL=5min)
spring:
  application:
    name: abs
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://127.0.0.1:27017/newsdb}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true

ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:5005}

spring.redis.cache:
  default-ttl: 300000  # 5min

logging:
  level:
    com.news.abs: INFO
    org.springframework.data.redis: DEBUG
    root: INFO
