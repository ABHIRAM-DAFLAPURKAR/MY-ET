services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' --quiet || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - news-network

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - news-network

  ai-brain:
    build: ./ai-brain-service
    container_name: ai-brain
    restart: unless-stopped
    ports:
      - "5005:5005"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - NEWS_API_KEY=${NEWS_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_TRANSFORMER_MODELS=true
    volumes:
      - ai_models:/app/models_cache  # Persist ML models
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5005/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - mongodb
      - redis
    networks:
      - news-network

  spring-backend:
    build: ./abs
    container_name: spring-backend
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/newsdb
      - AI_SERVICE_BASE_URL=http://ai-brain:5005
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEWS_API_KEY=${NEWS_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/news/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      - ai-brain
      - mongodb
      - redis
    networks:
      - news-network
    # Note: Run builds serially: docker compose build --parallel=1 (uses build: ./abs)

  frontend:
    build: ./frontend
    container_name: next-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8081
      - BACKEND_INTERNAL_URL=http://spring-backend:8080
    depends_on:
      - spring-backend
    networks:
      - news-network

volumes:
  mongodb_data:
  redis_data:
  ai_models:

networks:
  news-network:
    driver: bridge
